<script>
    const reasons = [
        {
            title: "#1",
            message: "u weird and i love it"
        },
        {
            title: "#2",
            message: "super sweet in every aspect ;>"
        },
        {
            title: "#3",
            message: "love ur antics, always makes me smile"
        },
        {
            title: "hope u have a nice day at work",
            message:
                "we can always watch movies or play games. " +
                "doesn't matter which one u like, as long as we do it together ❤️"
        }
    ];

    let currentReason = -1;

    function showNextReason() {
        currentReason++;

        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const button = document.getElementById("nextButton");
        const counter = document.getElementById("counter");

        if (currentReason >= reasons.length) {
            return;
        }

        title.textContent = reasons[currentReason].title;
        message.textContent = reasons[currentReason].message;

        if (currentReason < reasons.length - 1) {
            button.textContent = "❤️";
            counter.textContent =
                `${currentReason + 1} of ${reasons.length - 1}`;
        } else {
            button.style.display = "none";
            counter.textContent = "love, jovi";
        }
    }
</script>
